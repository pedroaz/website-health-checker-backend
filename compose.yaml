name: website-health-showcase
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: health
      POSTGRES_USER: health
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U health -d health"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.8
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes: [mailpit-data:/data]
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=postgres;Database=health;Username=health;Password=${POSTGRES_PASSWORD:-local-demo-password}
      Smtp__Host: mailpit
      AllowDemoTarget: "true"
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
    ports: ["127.0.0.1:${API_PORT:-8080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      mailpit: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/health/ready]
      interval: 3s
      timeout: 3s
      retries: 30
  frontend:
    build:
      context: ../website-health-checker-frontend
      target: runtime
    environment:
      API_BASE_URL: http://backend:8080
      MAILPIT_UI_URL: http://localhost:${MAILPIT_PORT:-8025}
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
  demo-target:
    profiles: [demo, test]
    image: node:24.14.0-alpine
    user: node
    working_dir: /demo
    volumes: [./demo-target:/demo:ro]
    command: [node, server.mjs]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthy').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  mailpit-data:
